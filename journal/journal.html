<!DOCTYPE html>
<html>
    <head>

        <style>
            td {
                border: solid 1px;
            }
        </style>
        <script>
            function Cell()
            {
                if (arguments.length===1)
                {
                    if (typeof arguments[0] === "string")
                    {
                        let e = document.getElementById(arguments[0]);
                        if (e.dataset.cell === undefined)
                        {
                            return e.innerText;
                        }
                        else
                        {
                            if (e.dataset.cell==="")
                                return e.innerText;
                            else
                                //return eval(e.dataset.cell+".call("+e+")");
                                return eval(e.dataset.cell);
                        }
                    }                                
                    else if (arguments[0] instanceof HTMLElement)
                    {
                        let e = arguments[0];
                        if (e.dataset.cell === undefined)
                        {
                            return e.innerText;
                        }
                        else
                        {
                            if (e.dataset.cell==="")
                                return e.innerText;
                            else
                                //return eval(e.dataset.cell+".call("+e+")");
                                return eval(e.dataset.cell);
                        }
                    }
                        
                } else if (arguments.length===3)
                {
                    if (typeof arguments[0] === "string")
                    {
                        let e = document.getElementById(arguments[0]);
                        if (e instanceof HTMLTableElement)
                        {
                            let tb = e.querySelector(":scope tbody");
                            let tr = tb.children[parseInt(arguments[1])]
                            let td = tr.children[parseInt(arguments[2])]
                            return Cell(td);
                        }
                    }
                }
                return null;                
            }
            let loaded=false;
            function onload()
            {
                naiveEvalCells();
                loaded=true;
            }
            function naiveEvalCells()
            {
                let cells = document.querySelectorAll('[data-cell]');
                for (c of cells)
                {
                    console.log(c);
                    console.log(Cell(c));
                    c.innerText = Cell(c);
                    if (!loaded)
                        c.addEventListener('input',()=>{naiveEvalCells();});
                }                
            }
        </script>
    </head>
    <body onload="onload();">        
        Max
        <table id="PointTable">
           <thead>
            <tr><td>Sequence</td><td>Max Credits</td><td>Max Points<br> (Assignment Weight [<span contenteditable="true" id="Assignment_Weight" class="Cell" data-cell="">100</span>])</td><td>Awarded Points</td></tr>
        </thead>
            <tbody>
                <tr><td>1,2.I,3.I</td>      <td>5</td>      <td data-cell="Cell('Assignment_Weight') * Cell('PointTable',0,1)"></td>   <td></td></tr>
                <tr><td>1,2.I,3.II</td>     <td>55</td>     <td data-cell="Cell('Assignment_Weight') * Cell('PointTable',1,1)"></td>   <td></td></tr>
                <tr><td>1,2.II,3.I</td>     <td>55</td>     <td data-cell="Cell('Assignment_Weight') * Cell('PointTable',2,1)"></td>   <td></td></tr>
                <tr><td>1,2.II,3.II</td>    <td>100</td>    <td data-cell="Cell('Assignment_Weight') * Cell('PointTable',3,1)"></td>   <td></td></tr>
            </tbody>
        </table>

</html>
